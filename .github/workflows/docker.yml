name: Build FS25 images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fs25-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime and installer
        run: |
          docker build --platform linux/amd64 --target runtime --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t fs25:runtime .
          docker build --platform linux/amd64 --target installer --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t fs25:installer .

      - name: Test FS25 code and egg
        run: |
          docker run --rm --entrypoint /usr/bin/python3 -e PYTHONPATH=/opt/fs25 -v "$PWD:/repo:ro" fs25:runtime -m unittest discover -s /repo/tests -v

      - name: Publish both images to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag fs25:runtime "$image:sha-$GITHUB_SHA"
          docker tag fs25:installer "$image:installer-sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:installer-sha-$GITHUB_SHA"
          docker tag fs25:runtime "$image:latest"
          docker tag fs25:installer "$image:installer"
          docker push "$image:latest"
          docker push "$image:installer"
          sed "s|ghcr.io/your-org/your-repo|$image|g" egg-farming-simulator-25.json > "$RUNNER_TEMP/egg-farming-simulator-25.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: farming-simulator-25-egg
          path: ${{ runner.temp }}/egg-farming-simulator-25.json
          if-no-files-found: error
