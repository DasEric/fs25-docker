name: Build FS25 image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fs25-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/daseric/fs25-docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the FS25 image
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t fs25:local .

      - name: Test FS25 code and egg
        run: |
          docker run --rm --user 1000:1000 --entrypoint /usr/bin/python3 -e PYTHONPATH=/opt/fs25 -v "$PWD:/repo:ro" fs25:local -m unittest discover -s /repo/tests -v
          docker run --rm --tmpfs /mnt/server:rw,uid=1001,gid=1001,mode=0700 fs25:local /bin/sh -c 'exec /usr/bin/python3 /opt/fs25/server.py install'

      - name: Publish the FS25 image to GHCR
        if: github.repository == 'DasEric/fs25-docker' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag fs25:local "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag fs25:local "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.repository == 'DasEric/fs25-docker' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: farming-simulator-25-egg
          path: egg-farming-simulator-25.json
          if-no-files-found: error
